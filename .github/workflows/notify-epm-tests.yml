name: Update EPM-TESTS coverage

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    name: Notify EPM-TESTS
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch coverage update
        env:
          GH_TOKEN: ${{ secrets.EPM_TESTS_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Repository secret EPM_TESTS_TOKEN is not configured."
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            --request POST \
            --url https://api.github.com/repos/ephpicman/EPM-TESTS/dispatches \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data '{"event_type":"epm-main-updated"}'
