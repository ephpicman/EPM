name: EPM Unit Tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} / PHPUnit ${{ matrix.phpunit }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: "8.0"
            phpunit: "9"
          - php: "8.1"
            phpunit: "10"
          - php: "8.2"
            phpunit: "11"
          - php: "8.3"
            phpunit: "12"
          - php: "8.4"
            phpunit: "13"
          - php: "8.5"
            phpunit: "13"
    steps:
      - name: Check out EPM-TESTS
        uses: actions/checkout@v4
        with:
          repository: ephpicman/EPM-TESTS
          ref: main
          path: EPM-TESTS

      - name: Check out the EPM revision being tested
        uses: actions/checkout@v4
        with:
          path: EPM-TESTS/EPM

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Download compatible PHPUnit
        working-directory: EPM-TESTS
        run: curl --fail --location --silent --show-error https://phar.phpunit.de/phpunit-${{ matrix.phpunit }}.phar --output phpunit.phar

      - name: Run unit tests
        working-directory: EPM-TESTS
        run: php phpunit.phar
