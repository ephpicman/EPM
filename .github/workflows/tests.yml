name: EPM Unit Tests

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: epm-unit-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }} / PHPUnit ${{ matrix.phpunit }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: "8.0"
            phpunit: "9"
          - php: "8.1"
            phpunit: "10"
          - php: "8.2"
            phpunit: "11"
          - php: "8.3"
            phpunit: "12"
          - php: "8.4"
            phpunit: "13"
          - php: "8.5"
            phpunit: "13"
    steps:
      - name: Check out Framework
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Download compatible PHPUnit
        run: curl --fail --location --silent --show-error https://phar.phpunit.de/phpunit-${{ matrix.phpunit }}.phar --output phpunit.phar

      - name: Run unit tests
        run: php phpunit.phar --configuration phpunit.xml

  coverage:
    name: Generate coverage report
    needs: tests
    runs-on: ubuntu-latest
    if: always() && needs.tests.result == 'success'
    steps:
      - name: Check out Framework
        uses: actions/checkout@v4

      - name: Set up PHP with Xdebug
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: "8.5"
          coverage: xdebug

      - name: Download PHPUnit 13
        run: curl --fail --location --silent --show-error https://phar.phpunit.de/phpunit-13.phar --output phpunit.phar

      - name: Generate JSONL coverage report with branch coverage
        run: php phpunit.phar --configuration phpunit.xml --branch-coverage --coverage-jsonl=coverage

      - name: Inspect PHPUnit JSONL coverage output
        if: always()
        run: |
          echo "=== PHP ==="
          php --version
          echo "=== PHPUnit ==="
          php phpunit.phar --version
          echo "=== Coverage directory ==="
          if [ -d coverage ]; then
            find coverage -maxdepth 2 -type f -printf '%p (%s bytes)\\n' | sort
          else
            echo "coverage directory does not exist"
          fi
          echo "=== Coverage metadata ==="
          if [ -f coverage/meta.json ]; then
            cat coverage/meta.json
          else
            echo "coverage/meta.json is missing"
          fi
          echo "=== Coverage JSONL preview ==="
          if [ -f coverage/coverage.jsonl ]; then
            sed -n '1,5p' coverage/coverage.jsonl
          else
            echo "coverage/coverage.jsonl is missing"
          fi
          echo "=== Other JSONL files ==="
          find coverage -maxdepth 1 -type f -name '*.jsonl' -printf '%f (%s bytes)\\n' 2>/dev/null | sort || true

      - name: Add coverage report to workflow summary
        run: php scripts/write-coverage-summary.php
