name: EPM Unit Tests

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: epm-unit-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }} / PHPUnit ${{ matrix.phpunit }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: "8.0"
            phpunit: "9"
          - php: "8.1"
            phpunit: "10"
          - php: "8.2"
            phpunit: "11"
          - php: "8.3"
            phpunit: "12"
          - php: "8.4"
            phpunit: "13"
          - php: "8.5"
            phpunit: "13"
    steps:
      - name: Check out Framework
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Download compatible PHPUnit
        run: curl --fail --location --silent --show-error https://phar.phpunit.de/phpunit-${{ matrix.phpunit }}.phar --output phpunit.phar

      - name: Run unit tests
        run: php phpunit.phar --configuration phpunit.xml

  coverage:
    name: Generate coverage report
    needs: tests
    runs-on: ubuntu-latest
    if: always() && needs.tests.result == 'success'
    steps:
      - name: Check out Framework
        uses: actions/checkout@v4

      - name: Set up PHP with Xdebug
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: "8.5"
          extensions: dom, mbstring, xml, xmlwriter
          coverage: xdebug

      - name: Install PHPUnit 13
        run: |
          mkdir -p "$RUNNER_TEMP/phpunit"
          cd "$RUNNER_TEMP/phpunit"
          composer init --no-interaction --name=epm/coverage-tools
          composer require --no-interaction --no-progress phpunit/phpunit:13.4.5
          echo "$RUNNER_TEMP/phpunit/vendor/bin" >> "$GITHUB_PATH"

      - name: Verify PHPUnit JSONL support
        run: |
          set -euo pipefail
          phpunit --version
          phpunit --help | grep -- --coverage-jsonl

      - name: Generate JSONL coverage report with branch coverage
        run: |
          phpunit --configuration phpunit.xml --branch-coverage --coverage-jsonl=coverage
          test -s coverage/meta.json
          test -s coverage/coverage.jsonl
          test -f coverage/tests.jsonl

      - name: Add coverage report to workflow summary
        run: php scripts/write-coverage-summary.php
